# Runs every check on each push and pull request: lint, the unit and database
# tests, the production build, and the browser tests.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI has its own throwaway MongoDB instead of Atlas.
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/uae_venture_guide
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The page sweep (tests/e2e/pages.spec.js) signs in with the demo accounts.
      - run: npm run seed
      # Chrome is already on the runner; Firefox and WebKit (Safari's engine) are installed here.
      - run: npx playwright install --with-deps firefox webkit
      # Starts `npm run dev` itself, then tests Chrome, Firefox, Safari and two phones.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
